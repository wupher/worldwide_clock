name: WorldwideClock
options:
  bundleIdPrefix: local.worldwideclock
  deploymentTarget:
    macOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '6.0'
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: '-'
    MACOSX_DEPLOYMENT_TARGET: '15.0'
targets:
  WorldwideClock:
    type: application
    platform: macOS
    sources: [App, Shared]
    info:
      path: Config/App-Info.plist
      properties:
        CFBundleDisplayName: Worldwide Clock
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '2'
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleURLTypes:
          - CFBundleURLName: local.worldwideclock.city
            CFBundleURLSchemes: [worldwideclock]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.worldwideclock
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      - target: ClockWidget
        embed: true
  ClockWidget:
    type: app-extension
    platform: macOS
    sources: [Widget, Shared]
    info:
      path: Config/Widget-Info.plist
      properties:
        CFBundleDisplayName: Worldwide Clock
        CFBundleShortVersionString: '1.0'
        CFBundleVersion: '2'
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Config/Widget.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.worldwideclock.widget
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
schemes:
  WorldwideClock:
    build:
      targets:
        WorldwideClock: all
